[package]
name = "iced_m3"
version = "0.1.0"
edition = "2024"
authors = [ "tpaau <tpaau-17db@tutamail.com>" ]
license = "MIT"

[dependencies]
iced = { version = "0.14.0", features = [ "advanced" ] }
iced_widget = {version = "0.14.2", features = [ "svg" ] }
lilt = "0.8"
num-traits = "0.2.19"
pollster = "1.0.1"
unicode-segmentation = "1.13.3"

[features]
advanced = []
pub-internal-const = []

[workspace]
members = [
  "demos/fonts",
  "demos/buttons",
  "demos/fab_menu",
  "demos/progress_indicators",
  "demos/fab",
  "demos/badges",
  "demos/navrail",
  "demos/switch",
  "demos/card"
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
