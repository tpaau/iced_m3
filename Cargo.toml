[package]
name = "iced_m3"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata.docs.rs]
rustdoc-args = [ "--cfg", "docsrs" ]
all-features = true

[dependencies]
iced = { version = "0.14.0", features = [ "advanced", "canvas" ] }
iced_widget = { version = "0.14.2", features = [ "svg" ] }
num-traits = "0.2.19"
palette = "0.7.7"
polymorpher = { version = "0.1.4", optional = true }
unicode-segmentation = "1.13.3"

[features]
default = [ "expressive-defaults", "shapes" ]
# Non-material widgets used internally that are also useful outside the library
advanced = []
pub-internal-const = []
# Makes the default motion scheme expressive
expressive-defaults = []
# Material Shapes - requires a dependency so it's optional
shapes = [ "dep:polymorpher", "iced/canvas" ]

[workspace]
members = ["demos/*"]

[lints.clippy]
too_many_arguments = "allow"
